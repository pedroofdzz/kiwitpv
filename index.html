<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kiwi Review - TPV Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="image_5ba85e.jpg">

    <!-- Librerías Externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- LIBRERÍA DE GRÁFICAS -->
    
    <style>
        :root { --primary: #0ea5e9; --success: #10b981; --danger: #f43f5e; --text-main: #f8fafc; --text-muted: #94a3b8; --bg-panel: rgba(15, 23, 42, 0.75); }
        body { font-family: system-ui, sans-serif; margin: 0; padding: 0; color: var(--text-main); background: linear-gradient(-45deg, #0f172a, #1e1b4b, #064e3b, #0c4a6e); background-size: 400% 400%; animation: gradientBG 15s ease infinite; min-height: 100vh; padding-bottom: 70px; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .panel { background: var(--bg-panel); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 20px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4); margin: 15px; }
        h2 { margin-top: 0; font-size: 1.3rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; color: #ffffff; }
        
        input { font-size: 16px; background: rgba(15, 23, 42, 0.8); color: white; }
        input[type="file"] { padding: 10px; background: rgba(255,255,255,0.1); border: 1px dashed var(--primary); }
        input, button { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; box-sizing: border-box; outline: none; }
        
        button { background: linear-gradient(135deg, var(--primary), #3b82f6); color: white; border: none; cursor: pointer; font-weight: bold; }
        button.btn-danger { background: linear-gradient(135deg, var(--danger), #be123c); }
        button.btn-success { background: linear-gradient(135deg, var(--success), #059669); }
        button:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; opacity: 0.5; }
        
        .item-lista { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* NUEVO: GRID PARA PRODUCTOS CON IMAGEN */
        .grid-tpv { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
        .card-prod { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 10px; text-align: center; transition: 0.2s; display: flex; flex-direction: column; justify-content: space-between; }
        .card-prod:active { transform: scale(0.95); background: rgba(14, 165, 233, 0.2); }
        .card-prod img { width: 100%; height: 90px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background: #1e293b; }
        .card-prod .nombre { font-size: 0.9rem; font-weight: bold; margin-bottom: 5px; height: 38px; overflow: hidden; }
        .badge-precio { background: var(--primary); color: white; padding: 4px 8px; border-radius: 8px; font-size: 0.9em; display: inline-block; width: 100%; box-sizing: border-box; }
        
        .controles-cantidad button { width: 38px; height: 38px; padding: 0; margin: 0 4px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; font-size: 1.2rem; }

        #contenedor-ticket { display: flex; flex-direction: column; align-items: center; }
        .ticket-preview { background: #ffffff !important; padding: 20px; width: 320px; min-width: 320px; font-family: monospace; color: #000000 !important; box-sizing: border-box; }
        .logo-ticket { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px auto; display: block; border: 2px dashed #000; }
        .ticket-header input { text-align: center; border: none; background: transparent; font-family: inherit; margin-bottom: 2px; width: 100%; color: #000; }
        .ticket-line { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: bold; }
        .ticket-total { font-size: 1.2rem; font-weight: 900; text-align: right; border-top: 2px dashed #000; margin-top: 10px; padding-top: 10px; }
        
        /* MENU DE NAVEGACIÓN INFERIOR */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); display: flex; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { flex: 1; padding: 15px 0; text-align: center; font-size: 0.8rem; font-weight: bold; color: var(--text-muted); cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; gap: 5px; }
        .nav-item.active { color: var(--primary); background: rgba(255,255,255,0.05); }
        .nav-item i { font-size: 1.2rem; }
        
        .vista { display: none; animation: fadeIn 0.3s ease; }
        .vista.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tarjetas de Estadísticas */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stat-valor { font-size: 1.8rem; font-weight: bold; color: var(--primary); }
    </style>
</head>
<body>

    <!-- VISTA 1: TPV Y CARRITO -->
    <div id="vista-tpv" class="vista active">
        <div class="panel">
            <h2>🛒 Punto de Venta</h2>
            <div id="lista-tpv" class="grid-tpv"></div>
        </div>

        <div class="panel" id="contenedor-ticket">
            <h2 style="width: 100%;">🧾 Ticket en Curso</h2>
            <div id="zona-ticket" class="ticket-preview">
                <div class="ticket-header" style="text-align: center; margin-bottom: 20px;">
                    <img src="image_5ba85e.jpg" alt="Logo" class="logo-ticket">
                    <input type="text" id="ticket-empresa" oninput="guardarTextosTicket()" style="font-weight: 900; font-size: 1.3rem;">
                    <input type="text" id="ticket-direccion" oninput="guardarTextosTicket()">
                    <div style="font-size: 0.9rem; margin-top: 8px; color: #444;">Ticket: #<span id="ticket-id">0001</span></div>
                    <div style="font-size: 0.9rem; color: #444;" id="ticket-fecha"></div>
                </div>
                
                <div style="border-bottom: 2px dashed #000; margin-bottom: 10px;"></div>
                <div id="ticket-items"></div>
                <div class="ticket-total">TOTAL: <span id="ticket-total-precio">0.00</span>€</div>
                
                <div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center;">
                    <div id="codigo-qr"></div>
                    <div style="text-align: center; font-size: 0.85rem; font-weight: bold; margin-top: 8px;">¡Síguenos en Instagram!</div>
                </div>
            </div>
            
            <button onclick="finalizarVenta()" class="btn-success" style="margin-top: 20px; font-size: 1.1rem; padding: 16px;">💶 Cobrar e Imprimir Ticket</button>
        </div>
    </div>

    <!-- VISTA 2: INVENTARIO (CON IMÁGENES) -->
    <div id="vista-inventario" class="vista">
        <div class="panel">
            <h2>📦 Añadir Producto</h2>
            <!-- NUEVO INPUT PARA FOTO -->
            <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; display: block;">Foto del producto (Opcional):</label>
            <input type="file" id="nuevo-foto" accept="image/*">
            
            <input type="text" id="nuevo-nombre" placeholder="✨ Nombre (Ej: Cartel QR + NFC)">
            <input type="number" id="nuevo-precio" placeholder="💶 Precio (€)" step="0.01" inputmode="decimal">
            <input type="number" id="nuevo-stock" placeholder="📦 Cantidad en stock" inputmode="numeric">
            <button onclick="agregarInventario()">➕ Añadir al Catálogo</button>
        </div>
        <div class="panel">
            <h2>📋 Catálogo Actual</h2>
            <div id="lista-inventario"></div>
            <button onclick="resetearSistema()" class="btn-danger" style="background: transparent; border: 1px solid var(--danger); margin-top: 20px;">⚠️ Formatear Inventario</button>
        </div>
    </div>

    <!-- VISTA 3: ESTADÍSTICAS Y VENTAS -->
    <div id="vista-estadisticas" class="vista">
        <div class="panel">
            <h2>📊 Resumen de Negocio</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Ingresos Totales</div>
                    <div class="stat-valor" id="stat-ingresos">0.00€</div>
                </div>
                <div class="stat-card">
                    <div style="font-size: 0.85rem; color: var(--text-muted);">Tickets Emitidos</div>
                    <div class="stat-valor" id="stat-tickets">0</div>
                </div>
            </div>
            <!-- CANVAS PARA LA GRÁFICA -->
            <canvas id="graficaVentas" style="width: 100%; height: 250px; background: rgba(255,255,255,0.02); border-radius: 10px; padding: 10px;"></canvas>
        </div>
        
        <div class="panel">
            <h2>🧾 Últimas Ventas</h2>
            <div id="lista-ventas"></div>
            <button onclick="borrarHistorialVentas()" class="btn-danger" style="background: transparent; border: 1px solid var(--danger); margin-top: 15px; padding: 10px;">🗑️ Borrar Historial de Ventas</button>
        </div>
    </div>

    <!-- MENÚ DE NAVEGACIÓN -->
    <div class="nav-bar">
        <div class="nav-item active" id="nav-tpv" onclick="cambiarVista('tpv')">
            <span>🛒</span> TPV
        </div>
        <div class="nav-item" id="nav-inventario" onclick="cambiarVista('inventario')">
            <span>📦</span> Inventario
        </div>
        <div class="nav-item" id="nav-estadisticas" onclick="cambiarVista('estadisticas')">
            <span>📊</span> Ventas
        </div>
    </div>

    <script>
        // --- SISTEMA DE BLOQUEO ---
        const claveCorrecta = "Kiwi2026";
        const intento = prompt("🔒 Área restringida. Introduce la contraseña del TPV:");
        if (intento !== claveCorrecta) {
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20vh;'>⛔ Acceso Denegado</h1>";
            throw new Error("Bloqueado.");
        }

        // --- DATOS ---
        let inventario = JSON.parse(localStorage.getItem('kiwi_inventario')) || [];
        let ventasHistorial = JSON.parse(localStorage.getItem('kiwi_ventas_historial')) || []; // NUEVA BASE DE DATOS DE VENTAS
        let numeroTicket = parseInt(localStorage.getItem('kiwi_ticket')) || 1;
        let carrito = []; 
        let miGrafica = null; // Variable para controlar la gráfica

        document.getElementById('ticket-empresa').value = localStorage.getItem('kiwi_texto_empresa') || "KIWI REVIEW";
        document.getElementById('ticket-direccion').value = localStorage.getItem('kiwi_texto_direccion') || "Un toque, cinco estrellas";

        // --- NAVEGACIÓN ---
        function cambiarVista(vista) {
            document.querySelectorAll('.vista').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(v => v.classList.remove('active'));
            
            document.getElementById('vista-' + vista).classList.add('active');
            document.getElementById('nav-' + vista).classList.add('active');
            
            if(vista === 'estadisticas') {
                actualizarEstadisticas();
            }
        }

        function guardarTextosTicket() {
            localStorage.setItem('kiwi_texto_empresa', document.getElementById('ticket-empresa').value);
            localStorage.setItem('kiwi_texto_direccion', document.getElementById('ticket-direccion').value);
        }

        function guardarDatos() {
            localStorage.setItem('kiwi_inventario', JSON.stringify(inventario));
            localStorage.setItem('kiwi_ticket', numeroTicket.toString());
            localStorage.setItem('kiwi_ventas_historial', JSON.stringify(ventasHistorial));
        }

        // --- INVENTARIO CON FOTOS ---
        function agregarInventario() {
            const inputFoto = document.getElementById('nuevo-foto');
            const n = document.getElementById('nuevo-nombre').value;
            const p = parseFloat(document.getElementById('nuevo-precio').value);
            const s = parseInt(document.getElementById('nuevo-stock').value);

            if (!n || isNaN(p) || isNaN(s)) return alert("Rellena nombre, precio y stock.");

            // Lógica para procesar la foto y guardarla
            let fotoBase64 = "";
            if (inputFoto.files && inputFoto.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoBase64 = e.target.result;
                    guardarProducto(n, p, s, fotoBase64);
                };
                reader.readAsDataURL(inputFoto.files[0]);
            } else {
                // Si no hay foto, guardamos el producto sin ella
                guardarProducto(n, p, s, fotoBase64);
            }
        }

        function guardarProducto(n, p, s, foto) {
            inventario.push({ 
                id: inventario.length ? Math.max(...inventario.map(i => i.id)) + 1 : 1, 
                nombre: n, 
                precio: p, 
                stock: s,
                imagen: foto // Guardamos la foto en texto Base64
            });
            document.getElementById('nuevo-nombre').value = ''; 
            document.getElementById('nuevo-precio').value = ''; 
            document.getElementById('nuevo-stock').value = '';
            document.getElementById('nuevo-foto').value = '';
            guardarDatos(); actualizarUI();
            alert("✅ Producto añadido correctamente.");
        }

        function eliminarDelInventario(id) {
            if(confirm("¿Eliminar este artículo del catálogo?")) {
                inventario = inventario.filter(prod => prod.id !== id);
                carrito = carrito.filter(item => item.id !== id);
                guardarDatos(); actualizarUI();
            }
        }

        // --- LÓGICA DE CARRITO ---
        function agregarAlCarrito(id) {
            const prod = inventario.find(p => p.id === id);
            if (prod && prod.stock > 0) {
                prod.stock--;
                const item = carrito.find(i => i.id === id);
                if (item) item.cantidad++; else carrito.push({ ...prod, cantidad: 1 });
                guardarDatos(); actualizarUI();
            }
        }

        function quitarDelCarrito(id) {
            const item = carrito.find(i => i.id === id), prod = inventario.find(p => p.id === id);
            if (item) {
                if(prod) prod.stock++;
                item.cantidad--;
                if (item.cantidad === 0) carrito = carrito.filter(i => i.id !== id);
                guardarDatos(); actualizarUI();
            }
        }

        // --- RENDERIZADO DE INTERFAZ ---
        function actualizarUI() {
            // Lista inventario
            const divInv = document.getElementById('lista-inventario'); divInv.innerHTML = '';
            inventario.forEach(prod => { 
                const imgTag = prod.imagen ? `<img src="${prod.imagen}" style="width: 40px; height: 40px; border-radius: 5px; object-fit: cover; margin-right: 10px;">` : '📦 ';
                divInv.innerHTML += `<div class="item-lista"><div style="flex: 1; display:flex; align-items:center;">${imgTag}<div><strong style="color: var(--primary);">${prod.nombre}</strong><br><span style="color: var(--text-muted); font-size: 0.85rem;">${prod.precio.toFixed(2)}€ | Stock: ${prod.stock}</span></div></div><button onclick="eliminarDelInventario(${prod.id})" class="btn-danger" style="width: auto; padding: 10px; margin: 0; border-radius: 8px;">🗑️</button></div>`; 
            });

            // Grid TPV con Fotos
            const divTPV = document.getElementById('lista-tpv'); divTPV.innerHTML = '';
            inventario.forEach(prod => { 
                const ag = prod.stock === 0; 
                // Imagen por defecto si no subió foto
                const imgSrc = prod.imagen ? prod.imagen : 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>';
                
                divTPV.innerHTML += `
                    <div class="card-prod" style="${ag ? 'opacity:0.5; pointer-events:none;' : ''}" onclick="${ag ? '' : `agregarAlCarrito(${prod.id})`}">
                        <img src="${imgSrc}" alt="${prod.nombre}">
                        <div class="nombre">${prod.nombre}</div>
                        <div class="badge-precio">${ag ? 'AGOTADO' : prod.precio.toFixed(2) + '€'}</div>
                    </div>`; 
            });

            // Ticket
            const divTick = document.getElementById('ticket-items'); divTick.innerHTML = ''; let t = 0;
            carrito.forEach(item => { const sub = item.precio * item.cantidad; t += sub; divTick.innerHTML += `<div class="ticket-line" style="margin-top: 5px;"><span>${item.cantidad}x ${item.nombre}</span><span>${sub.toFixed(2)}€</span></div><div class="controles-cantidad" style="text-align: right; margin-bottom: 10px;" data-html2canvas-ignore><button onclick="quitarDelCarrito(${item.id})" class="btn-danger" style="background:var(--danger);">-</button><button onclick="agregarAlCarrito(${item.id})" style="background: var(--primary);">+</button></div>`; });

            document.getElementById('ticket-total-precio').innerText = t.toFixed(2);
            document.getElementById('ticket-id').innerText = String(numeroTicket).padStart(4, '0');
            const d = new Date(); document.getElementById('ticket-fecha').innerText = `${d.toLocaleDateString()} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
        }

        // --- FINALIZAR VENTA Y ESTADÍSTICAS ---
        function finalizarVenta() {
            if (carrito.length === 0) return alert("⚠️ El ticket está vacío.");
            
            const btn = document.querySelector('button[onclick="finalizarVenta()"]');
            btn.innerText = "⏳ Generando y Guardando..."; btn.disabled = true;

            // 1. Guardar la venta en el historial
            let totalVenta = 0;
            carrito.forEach(i => totalVenta += (i.precio * i.cantidad));
            
            ventasHistorial.push({
                id: numeroTicket,
                fecha: new Date().toLocaleDateString(),
                hora: new Date().toLocaleTimeString(),
                total: totalVenta,
                articulos: carrito.length // Cuantos tipos de articulos llevó
            });

            // 2. Imprimir/Descargar Imagen
            html2canvas(document.getElementById('zona-ticket'), { backgroundColor: "#ffffff", scale: 2, useCORS: true }).then(canvas => {
                const a = document.createElement("a"); a.href = canvas.toDataURL("image/png"); a.download = `Ticket_${String(numeroTicket).padStart(4, '0')}.png`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                
                // 3. Limpiar y continuar
                carrito = []; numeroTicket++; 
                guardarDatos(); actualizarUI();
                
                btn.innerText = "✅ Venta Registrada"; 
                setTimeout(() => { btn.innerText = "💶 Cobrar e Imprimir Ticket"; btn.disabled = false; }, 2000);
            });
        }

        // --- MOTOR DE GRÁFICAS Y ESTADÍSTICAS ---
        function actualizarEstadisticas() {
            let ingresosTotales = 0;
            const listaDiv = document.getElementById('lista-ventas');
            listaDiv.innerHTML = '';

            // Agrupar ventas por día para la gráfica
            const ventasPorDia = {};

            // Renderizar la lista al revés (más recientes primero)
            [...ventasHistorial].reverse().forEach(venta => {
                ingresosTotales += venta.total;
                
                // Sumar al día correspondiente
                if(ventasPorDia[venta.fecha]) ventasPorDia[venta.fecha] += venta.total;
                else ventasPorDia[venta.fecha] = venta.total;

                listaDiv.innerHTML += `
                    <div class="item-lista">
                        <div>
                            <strong style="color:white;">Ticket #${String(venta.id).padStart(4, '0')}</strong><br>
                            <span style="font-size:0.8rem; color:var(--text-muted);">${venta.fecha} a las ${venta.hora}</span>
                        </div>
                        <div style="font-size:1.1rem; font-weight:bold; color:var(--success);">${venta.total.toFixed(2)}€</div>
                    </div>`;
            });

            if(ventasHistorial.length === 0) listaDiv.innerHTML = '<p style="text-align:center; color:#94a3b8;">Aún no hay ventas registradas.</p>';

            document.getElementById('stat-ingresos').innerText = ingresosTotales.toFixed(2) + '€';
            document.getElementById('stat-tickets').innerText = ventasHistorial.length;

            dibujarGrafica(ventasPorDia);
        }

        function dibujarGrafica(datosAgrupados) {
            const ctx = document.getElementById('graficaVentas').getContext('2d');
            
            // Si ya existe una gráfica, la destruimos para redibujarla limpia
            if(miGrafica != null) miGrafica.destroy();

            const etiquetasDias = Object.keys(datosAgrupados).reverse().slice(-7); // Últimos 7 días
            const valoresDinero = etiquetasDias.map(dia => datosAgrupados[dia]);

            miGrafica = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: etiquetasDias,
                    datasets: [{
                        label: 'Ingresos (€)',
                        data: valoresDinero,
                        backgroundColor: '#0ea5e9',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                    }
                }
            });
        }

        function borrarHistorialVentas() {
            if(confirm("¿Seguro que quieres borrar todas las estadísticas y el historial de ventas? Esto no borrará el inventario.")) {
                ventasHistorial = [];
                guardarDatos();
                actualizarEstadisticas();
            }
        }

        function resetearSistema() {
            if(confirm("⚠️ ¿Formatear TODO el inventario?")) {
                inventario = []; carrito = []; numeroTicket = 1;
                guardarDatos(); actualizarUI();
            }
        }

        // 1. Inicializar
        actualizarUI();

        // 2. Generar QR de Instagram
        new QRCode(document.getElementById("codigo-qr"), {
            text: "https://www.instagram.com/kiwi__review/?hl=es", 
            width: 90, height: 90, colorDark : "#000000", colorLight : "#ffffff", correctLevel : QRCode.CorrectLevel.L
        });
    </script>
</body>
</html>
